name: Compilar GestorPDF para Windows (v2.4 · ENVIAR BIHOTZ)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Test y compilacion Windows
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Pruebas del motor PDF
        run: |
          python -m compileall -q app.py pdf_core.py document_routes.py bihotz_email.py
          python -m unittest discover -s tests -v
          python -c "import app, customtkinter, tkinterdnd2, fitz, document_routes, keyring, bihotz_email, win32com.client"

      - name: Construir ejecutable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name GestorPDF
          --additional-hooks-dir hooks
          --collect-all customtkinter
          --collect-all tkinterdnd2
          --collect-all keyring
          --hidden-import win32timezone
          app.py

      - name: Empaquetar carpeta de aplicacion
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GestorPDF/*" -DestinationPath "GestorPDF-Windows.zip"

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: GestorPDF-Windows
          path: GestorPDF-Windows.zip
          if-no-files-found: error
          retention-days: 30
