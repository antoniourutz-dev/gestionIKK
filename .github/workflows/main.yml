
name: Compilar GestorPDF para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Compilacion Windows
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Comprobar codigo
        run: |
          python -m compileall -q app.py pdf_core.py
          python -m unittest discover -s tests -v
          python -c "import app, customtkinter, tkinterdnd2, fitz"

      - name: Crear ejecutable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name GestorPDF
          --additional-hooks-dir hooks
          --collect-all customtkinter
          --collect-all tkinterdnd2
          app.py

      - name: Crear ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GestorPDF/*" -DestinationPath "GestorPDF-Windows.zip"

      - name: Publicar aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: GestorPDF-Windows
          path: GestorPDF-Windows.zip
          if-no-files-found: error
